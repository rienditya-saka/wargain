# Backup keep-alive for the Supabase project (the main one runs on PM2: wargain-keepalive).
# Keeps the free project from being paused even if the server is off for days.
# Needs repository secrets: SUPABASE_URL, SUPABASE_SECRET_KEY (Settings → Secrets and variables → Actions).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 1 * * *" # daily 01:17 UTC (08:17 WIB)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          KEEPALIVE_SOURCE: github-actions
        run: node scripts/supabase-keepalive.mjs
